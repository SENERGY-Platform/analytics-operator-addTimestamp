name: 'PROD Docker Image'

# master builds the existing :prod tags plus :vX.Y.Z; release/vN keeps an older major
# alive and builds only its :vN.x.y. The git tag is pushed after the image, so a failed
# build never consumes a version.
on:
  push:
    branches:
      - master
      - 'release/v*'
jobs:
  multi:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The platform registers a version from the manifest at its tag, so the manifest is
      # regenerated and committed before the version is computed, built and tagged.
      - name: Regenerate the operator manifest
        run: |
          mvn -B -q -DskipTests package
          java -cp target/operator-addTimestamp-jar-with-dependencies.jar org.infai.ses.senergy.operators.Manifest AddTimestamp
          if [ -n "$(git status --porcelain -- operator-manifest.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add operator-manifest.json
            git commit -m 'chore: regenerate the operator manifest [skip ci]'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Version
        id: version
        run: echo "tag=$(.github/scripts/next-version.sh "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"
      - name: Image tags
        id: tags
        run: |
          {
            echo 'list<<EOF'
            echo "ghcr.io/senergy-platform/analytics-operator-add-timestamp:${{ steps.version.outputs.tag }}"
            if [ "$GITHUB_REF_NAME" = 'master' ]; then
              echo 'smartenergyplatform/analytics-operator-add-timestamp:prod'
              echo 'ghcr.io/senergy-platform/analytics-operator-add-timestamp:prod'
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
      - name: Push version tag
        run: |
          tag='${{ steps.version.outputs.tag }}'
          if [ -z "$(git tag --points-at HEAD --list "$tag")" ]; then
            git tag "$tag"
            git push origin "$tag"
          fi
