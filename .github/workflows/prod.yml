name: 'PROD Docker Image'

# master builds the existing :prod tags plus :vX.Y.Z; release/vN keeps an older major
# alive and builds only its :vN.x.y. The git tag is pushed after the image, so a failed
# build never consumes a version.
on:
  push:
    branches:
      - master
      - 'release/v*'

permissions:
  contents: read

env:
  GHCR: ghcr.io/senergy-platform/analytics-operator-add-timestamp
  HUB: smartenergyplatform/analytics-operator-add-timestamp

jobs:
  # Settles the commit to build and its version. The manifest is regenerated here, so the
  # commit can be a new one that the push did not contain; the build jobs check that one
  # out. This is why the image is not built by docker/github-builder, which always builds
  # the pushed commit.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.head.outputs.sha }}
      tag: ${{ steps.version.outputs.tag }}
      tags: ${{ steps.tags.outputs.list }}
      names: ${{ steps.tags.outputs.names }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The platform registers a version from the manifest at its tag, so the manifest is
      # regenerated and committed before the version is computed, built and tagged.
      - name: Regenerate the operator manifest
        run: |
          mvn -B -q -DskipTests package
          java -cp target/operator-addTimestamp-jar-with-dependencies.jar org.infai.ses.senergy.operators.Manifest AddTimestamp
          if [ -n "$(git status --porcelain -- operator-manifest.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add operator-manifest.json
            git commit -m 'chore: regenerate the operator manifest [skip ci]'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Commit to build
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Version
        id: version
        run: echo "tag=$(.github/scripts/next-version.sh "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"
      # Docker Hub only gets :prod, which only master builds.
      - name: Image tags
        id: tags
        run: |
          {
            echo 'list<<EOF'
            echo "$GHCR:${{ steps.version.outputs.tag }}"
            if [ "$GITHUB_REF_NAME" = 'master' ]; then
              echo "$HUB:prod"
              echo "$GHCR:prod"
            fi
            echo 'EOF'
            if [ "$GITHUB_REF_NAME" = 'master' ]; then
              echo "names=$HUB,$GHCR"
            else
              echo "names=$GHCR"
            fi
          } >> "$GITHUB_OUTPUT"

  # One native runner per platform, arm64 without QEMU. Each pushes its image by digest
  # only; merge puts both under the tags.
  build:
    needs: [prepare]
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,"name=${{ needs.prepare.outputs.names }}",push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      # Per image name, the tags of that name over the digests pushed to it.
      - name: Put both platforms under the tags
        working-directory: ${{ runner.temp }}/digests
        env:
          NAMES: ${{ needs.prepare.outputs.names }}
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          IFS=',' read -ra names <<< "$NAMES"
          for name in "${names[@]}"; do
            args=()
            while read -r tag; do
              case "$tag" in "$name":*) args+=(--tag "$tag") ;; esac
            done <<< "$TAGS"
            docker buildx imagetools create "${args[@]}" $(printf "$name@sha256:%s " *)
            docker buildx imagetools inspect "${args[1]}"
          done
      - name: Push version tag
        run: |
          tag='${{ needs.prepare.outputs.tag }}'
          if [ -z "$(git tag --points-at HEAD --list "$tag")" ]; then
            git tag "$tag"
            git push origin "$tag"
          fi
